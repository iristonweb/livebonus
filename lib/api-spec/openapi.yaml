openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Live Score — Housing Trust Infrastructure API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and balance
  - name: transactions
    description: Bonus point transactions
  - name: partners
    description: Partner merchants
  - name: offers
    description: Partner offers
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: score
    description: Live Score — tenant trust rating
  - name: leases
    description: Rental lease agreements
  - name: finance
    description: Authoritative monetary bonus quotes and settlements
  - name: admin
    description: Administrator tools and audit history

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "404":
          description: User not found
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid profile input
        "401":
          description: Authentication required
        "404":
          description: User not found

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions for current user
      parameters:
        - in: query
          name: category
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          name: offset
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a new bonus transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List all partners
      parameters:
        - in: query
          name: category
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Partner list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partners]
      summary: Create a partner (admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Created partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"

  /partners/maintenance/cleanup-logos:
    post:
      operationId: cleanupPartnerLogos
      tags: [partners]
      summary: Review or remove orphaned partner logo objects (admin)
      description: Lists managed partner logo objects that are no longer referenced by a partner. The default is a dry-run; set dryRun to false to remove the reviewed orphaned objects.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerLogoCleanupInput"
      responses:
        "200":
          description: Logo cleanup review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLogoCleanupResult"
        "400":
          description: Invalid cleanup request
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /partners/maintenance/cleanup-logos/history:
    get:
      operationId: listPartnerLogoCleanupHistory
      tags: [partners]
      summary: List prior partner logo cleanup runs (admin)
      description: Returns the immutable history of logo cleanup dry-runs and confirmed runs. This endpoint is read-only.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          description: Filter cleanup history by whether any deletion failed.
          schema:
            type: string
            enum: [all, failed]
            default: all
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
      responses:
        "200":
          description: Prior logo cleanup runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerLogoCleanupHistoryEntry"
        "400":
          description: Invalid history query
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned object storage upload URL
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadRequest"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"

  /storage/kyc/uploads/request-url:
    post:
      operationId: requestKycUploadUrl
      tags: [users]
      summary: Request a private upload URL for a verification document
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycUploadRequest"
      responses:
        "200":
          description: Private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"
        "400":
          description: Unsupported file
        "401":
          description: Authentication required
        "503":
          description: Object storage unavailable

  /storage/objects/{objectPath}:
    get:
      operationId: getStoredObject
      tags: [storage]
      summary: Serve an uploaded object
      parameters:
        - in: path
          name: objectPath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored object

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get partner by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
    patch:
      operationId: updatePartner
      tags: [partners]
      summary: Update a partner (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdate"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
    delete:
      operationId: deletePartner
      tags: [partners]
      summary: Delete a partner (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "204":
          description: Deleted

  /offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: List all active offers
      parameters:
        - in: query
          name: partnerId
          schema:
            type: integer
          required: false
        - in: query
          name: category
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Offer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"
    post:
      operationId: createOffer
      tags: [offers]
      summary: Create an offer (admin/partner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: Created offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"

  /offers/saved:
    get:
      operationId: listSavedOffers
      tags: [offers]
      summary: List saved and activated offers for the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Saved and activated offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"

  /offers/{id}:
    get:
      operationId: getOffer
      tags: [offers]
      summary: Get an offer by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
    patch:
      operationId: updateOffer
      tags: [offers]
      summary: Update an offer (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferUpdate"
      responses:
        "200":
          description: Updated offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
    delete:
      operationId: deleteOffer
      tags: [offers]
      summary: Delete an offer (admin)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "204":
          description: Deleted

  /admin/catalog-audit-log:
    get:
      operationId: listCatalogAuditLog
      tags: [admin]
      summary: List catalog administrator audit events
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
        - in: query
          name: entityType
          schema:
            type: string
            enum: [partner, offer]
          required: false
        - in: query
          name: action
          schema:
            type: string
            enum: [create, update, delete]
          required: false
      responses:
        "200":
          description: Catalog audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogAuditLog"

  /admin/catalog-audit-log/export:
    get:
      operationId: exportCatalogAuditLog
      tags: [admin]
      summary: Export filtered catalog administrator audit events
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: entityType
          schema:
            type: string
            enum: [partner, offer]
          required: false
        - in: query
          name: action
          schema:
            type: string
            enum: [create, update, delete]
          required: false
      responses:
        "200":
          description: CSV export of catalog audit events
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid export query
        "401":
          description: Authentication required
        "403":
          description: Administrator access required

  /admin/security/webhook-rejections:
    get:
      operationId: getWebhookRejectionSecuritySummary
      tags: [admin]
      summary: Review rejected YooKassa webhook sources
      description: Returns bounded operational counts and recent source addresses only. Notification payloads and payment identifiers are never included.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Webhook rejection security summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRejectionSecuritySummary"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required

  /offers/{id}/save:
    post:
      operationId: saveOffer
      tags: [offers]
      summary: Save an offer for the current user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Saved offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferActionResponse"
    delete:
      operationId: deleteSavedOffer
      tags: [offers]
      summary: Remove an offer from the current user's saved list
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "204":
          description: Offer removed from the saved list
        "401":
          description: Authentication required

  /offers/{id}/activate:
    post:
      operationId: activateOffer
      tags: [offers]
      summary: Activate an offer for the current user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Activated offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferActionResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get user dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get bonus stats by category
      responses:
        "200":
          description: Stats by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  /bonus/calculate:
    post:
      operationId: calculateBonus
      tags: [dashboard]
      summary: Calculate bonus for a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BonusCalculationInput"
      responses:
        "200":
          description: Bonus calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusCalculationResult"

  /finance/policy:
    get:
      operationId: getFinancialPolicy
      tags: [finance]
      summary: Get the active monetary bonus policy
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialPolicy"

  /finance/quotes/purchase:
    post:
      operationId: quotePartnerPurchase
      tags: [finance]
      summary: Calculate a partner purchase before settlement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseQuoteInput"
      responses:
        "200":
          description: Purchase quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseQuote"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "401":
          description: Authentication required
        "404":
          description: User not found
        "503":
          description: Financial policy is not initialized
        "422":
          description: Invalid amount, cap, or balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseQuote"

  /finance/quotes/rental:
    post:
      operationId: quoteRentalDeal
      tags: [finance]
      summary: Calculate a rental deal before settlement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalQuoteInput"
      responses:
        "200":
          description: Rental quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalQuote"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "401":
          description: Authentication required
        "503":
          description: Financial policy is not initialized
        "422":
          description: Invalid amount or policy limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalQuote"

  /finance/purchases/settle:
    post:
      operationId: settlePartnerPurchase
      tags: [finance]
      summary: Deprecated direct settlement endpoint
      deprecated: true
      responses:
        "410":
          description: Direct settlement is disabled; use provider checkout and status verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"

  /finance/purchases/checkout:
    post:
      operationId: createPurchaseCheckout
      tags: [finance]
      summary: Create a YooKassa checkout for a valid partner purchase
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCheckoutInput"
      responses:
        "201":
          description: Provider checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCheckoutResponse"
        "200":
          description: Idempotent replay of a checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCheckoutResponse"
        "422":
          description: Invalid purchase quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "400":
          description: Invalid request or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "401":
          description: Authentication required
        "404":
          description: User or partner not found
        "409":
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "502":
          description: Provider checkout failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "503":
          description: Financial policy is not initialized

  /finance/purchases/{id}/status:
    get:
      operationId: getPurchasePaymentStatus
      tags: [finance]
      summary: Verify a YooKassa payment and settle a purchase when succeeded
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current provider and deal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePaymentStatusResponse"
        "400":
          description: Invalid purchase id
        "401":
          description: Authentication required
        "404":
          description: Purchase not found
        "409":
          description: Provider payment is not complete or belongs to another purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "502":
          description: Payment provider status check failed

  /finance/rentals/checkout:
    post:
      operationId: createRentalCheckout
      tags: [finance]
      summary: Create a YooKassa checkout for a valid rental payment
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalCheckoutInput"
      responses:
        "201":
          description: Provider checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalCheckoutResponse"
        "200":
          description: Idempotent replay of a checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalCheckoutResponse"
        "422":
          description: Invalid rental quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "400":
          description: Invalid request or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "401":
          description: Authentication required
        "404":
          description: Tenant, lease, or landlord not found
        "409":
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "502":
          description: Provider checkout failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "503":
          description: Financial policy is not initialized

  /finance/rentals/{id}/status:
    get:
      operationId: getRentalPaymentStatus
      tags: [finance]
      summary: Verify a YooKassa rental payment and settle it when succeeded
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current provider and rental status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPaymentStatusResponse"
        "400":
          description: Invalid rental id
        "401":
          description: Authentication required
        "404":
          description: Rental payment not found
        "409":
          description: Provider payment is not complete or belongs to another rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"
        "502":
          description: Payment provider status check failed

  /finance/yookassa/webhook:
    post:
      operationId: receiveYooKassaWebhook
      tags: [finance]
      summary: Receive a YooKassa payment notification
      responses:
        "200":
          description: Notification accepted after provider verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "401":
          description: Webhook source is not in the explicitly configured YooKassa allowlist

  /finance/rentals/settle:
    post:
      operationId: settleRentalDeal
      tags: [finance]
      summary: Deprecated direct settlement endpoint
      deprecated: true
      responses:
        "410":
          description: Direct settlement is disabled; use provider checkout and status verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceError"

  /finance/ledger:
    get:
      operationId: listFinancialLedger
      tags: [finance]
      summary: List the current user's monetary bonus ledger
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
        - in: query
          name: category
          description: Filter by the legacy transaction category.
