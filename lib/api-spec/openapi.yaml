        reason:
          type: string
          minLength: 3
          maxLength: 500
        idempotencyKey:
          type: string
          minLength: 1

    BalanceReconciliationCorrection:
      type: object
      required: [id, userId, operatorUserId, correctionTarget, reason, idempotencyKey, beforePointsBalance, afterPointsBalance, beforeBonusBalanceRub, afterBonusBalanceRub, beforeDifferenceCents, afterDifferenceCents, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        operatorUserId:
          type: integer
        correctionTarget:
          type: string
          enum: [monetary, points]
        reason:
          type: string
        idempotencyKey:
          type: string
        beforePointsBalance:
          type: integer
        afterPointsBalance:
          type: integer
        beforeBonusBalanceRub:
          type: ["number", "null"]
        afterBonusBalanceRub:
          type: number
        beforeDifferenceCents:
          type: ["integer", "null"]
        afterDifferenceCents:
          type: integer
        createdAt:
          type: string

    BalanceReconciliationDetail:
      allOf:
        - $ref: "#/components/schemas/BalanceReconciliation"
        - type: object
          required: [corrections]
          properties:
            corrections:
              type: array
              items:
                $ref: "#/components/schemas/BalanceReconciliationCorrection"

    BalanceReconciliationCorrectionResponse:
      type: object
      required: [reconciliation, correction, idempotent]
      properties:
        reconciliation:
          $ref: "#/components/schemas/BalanceReconciliation"
        correction:
          $ref: "#/components/schemas/BalanceReconciliationCorrection"
        idempotent:
          type: boolean

    Partner:
      type: object
      required: [id, name, category, bonusMultiplier, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [rent, utilities, transport, health, food, other]
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        logoObjectPath:
          type: ["string", "null"]
        bonusMultiplier:
          type: number
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        isActive:
          type: boolean
        totalTransactions:
          type: ["integer", "null"]
