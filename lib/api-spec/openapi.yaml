      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Late payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          description: Authentication required
        "404":
          description: Lease not found

components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, phone, name, pointsBalance, status, liveScore, verificationLevel, isAdmin, createdAt]
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        pointsBalance:
          type: integer
        bonusBalanceRub:
          type: number
        status:
          type: string
          enum: [novice, silver, gold, platinum]
        statusMultiplier:
          type: number
        pointsToNextStatus:
          type: ["integer", "null"]
        nextStatus:
          type: ["string", "null"]
        liveScore:
          type: integer
        verificationLevel:
          type: integer
        isPhoneVerified:
          type: boolean
        isIdentityVerified:
          type: boolean
        isIncomeVerified:
          type: boolean
        identityVerificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        incomeVerificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        isAdmin:
          type: boolean
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    VerificationStatus:
      type: string
      enum: [not_started, pending, approved, rejected]

    KycUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          maxLength: 160
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]

    VerificationSubmission:
      type: object
      required: [objectPath, fileName, contentType, fileSize]
      properties:
        objectPath:
          type: string
        fileName:
          type: string
          maxLength: 160
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
        fileSize:
          type: integer
          minimum: 1
          maximum: 10485760

    VerificationApplication:
      type: object
      required: [id, verificationType, status, fileName, contentType, fileSize, createdAt]
      properties:
        id:
          type: integer
        verificationType:
          type: string
          enum: [identity, income]
        status:
          $ref: "#/components/schemas/VerificationStatus"
        fileName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        rejectionReason:
          type: ["string", "null"]
        createdAt:
          type: string
        decidedAt:
          type: ["string", "null"]

    VerificationQueueItem:
      allOf:
        - $ref: "#/components/schemas/VerificationApplication"
        - type: object
          required: [user]
          properties:
            user:
              type: ["object", "null"]
              properties:
                id:
                  type: integer
                name:
                  type: string
                phone:
                  type: string

    VerificationDecisionInput:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        comment:
          type: string
          maxLength: 1000

    Transaction:
      type: object
      required: [id, userId, type, category, amountRub, amountRubSigned, bonusValueRub, direction, dealType, settlementStatus, operationSource, isReversal, pointsEarned, description, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [earn, redeem, expire, bonus]
        category:
          type: string
          enum: [rent, utilities, transport, health, food, other]
        amountRub:
          type: number
        amountRubSigned:
          type: number
        bonusValueRub:
          type: number
        direction:
          type: ["string", "null"]
          enum: [debit, credit, null]
        dealType:
          type: ["string", "null"]
          enum: [partner_purchase, rental_deal, null]
        settlementStatus:
          type: ["string", "null"]
          enum: [settled, refunded, null]
        operationSource:
          type: ["string", "null"]
        isReversal:
          type: boolean
        pointsEarned:
          type: integer
        multiplier:
          type: number
        description:
          type: string
        partnerName:
          type: ["string", "null"]
        partnerLogoUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    TransactionInput:
      type: object
      required: [type, category, amountRub, pointsEarned, description]
      properties:
        userId:
          type: integer
        type:
          type: string
          enum: [earn, redeem, expire, bonus]
        category:
          type: string
          enum: [rent, utilities, transport, health, food, other]
        amountRub:
          type: number
        amountRubSigned:
          type: number
        direction:
          type: ["string", "null"]
          enum: [debit, credit, null]
        pointsEarned:
          type: integer
        multiplier:
          type: number
        description:
          type: string
        partnerId:
          type: ["integer", "null"]

    FinancialPolicy:
      type: object
      required: [id, version, currency, purchaseRedemptionRate, partnerFeeRate, rentalBonusRate, effectiveFrom]
      properties:
        id:
          type: integer
        version:
          type: integer
        currency:
          type: string
          enum: [RUB]
        purchaseRedemptionRate:
          type: number
        partnerFeeRate:
          type: number
        rentalBonusRate:
          type: number
        effectiveFrom:
          type: string

    FinanceError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        reasons:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string

    PurchaseQuoteInput:
      type: object
      required: [grossAmountRub]
      properties:
        grossAmountRub:
          type: number
          minimum: 0
        requestedBonusRub:
          type: number
          minimum: 0
        partnerId:
          type: integer

    RentalQuoteInput:
      type: object
      required: [grossAmountRub]
      properties:
        grossAmountRub:
          type: number
          minimum: 0

    PurchaseSettlementInput:
      type: object
      required: [grossAmountRub]
      properties:
        grossAmountRub:
          type: number
          minimum: 0
        requestedBonusRub:
          type: number
          minimum: 0
        partnerId:
          type: integer
        externalReference:
          type: string
        idempotencyKey:
          type: string
          minLength: 1

    PurchaseCheckoutInput:
      type: object
      required: [grossAmountRub]
      properties:
        grossAmountRub:
          type: number
          minimum: 0
        requestedBonusRub:
          type: number
          minimum: 0
        partnerId:
          type: integer
        externalReference:
          type: string
        idempotencyKey:
          type: string
          minLength: 1
        paymentMethod:
          type: string
          enum: [sbp, mir_pay]
          default: mir_pay
          description: Payment method for the YooKassa hosted checkout. Mir Pay is passed as the native YooKassa mir_pay type.

    RentalCheckoutInput:
      type: object
      required: [leaseId, grossAmountRub]
      properties:
        leaseId:
          type: integer
        grossAmountRub:
          type: number
          minimum: 0
        externalReference:
          type: string
        idempotencyKey:
          type: string
          minLength: 1
        paymentMethod:
          type: string
          enum: [sbp, mir_pay]
          default: mir_pay
          description: Payment method for the YooKassa hosted checkout. Mir Pay is passed as the native YooKassa mir_pay type.

    RentalSettlementInput:
      type: object
      required: [leaseId, grossAmountRub]
      properties:
        leaseId:
          type: integer
        grossAmountRub:
          type: number
          minimum: 0
        landlordUserId:
          type: integer
        externalReference:
          type: string
        idempotencyKey:
          type: string
          minLength: 1

    PurchaseQuote:
      type: object
      required: [kind, valid, currency, policyVersion, grossAmountRub, maxBonusRedemptionRub, availableBonusRub, requestedBonusRub, bonusRedeemedRub, netAmountRub, partnerFeeRub, rates, breakdown, errors]
      properties:
        kind:
          type: string
          enum: [partner_purchase]
        valid:
          type: boolean
        currency:
          type: string
          enum: [RUB]
        policyVersion:
          type: integer
        grossAmountRub:
          type: number
        maxBonusRedemptionRub:
          type: number
        availableBonusRub:
          type: number
        requestedBonusRub:
          type: number
        bonusRedeemedRub:
          type: number
        netAmountRub:
          type: number
        partnerFeeRub:
          type: number
        rates:
          type: object
          required: [maxRedemptionRate, partnerFeeRate]
          properties:
            maxRedemptionRate:
              type: number
            partnerFeeRate:
              type: number
        breakdown:
          type: object
          required: [grossRub, redemptionCapRub, balanceCapRub, bonusRedeemedRub, netRub, partnerFeeRub]
          properties:
            grossRub:
              type: number
            redemptionCapRub:
              type: number
            balanceCapRub:
              type: number
            bonusRedeemedRub:
              type: number
            netRub:
              type: number
            partnerFeeRub:
              type: number
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string

    RentalQuote:
      type: object
      required: [kind, valid, currency, policyVersion, grossAmountRub, landlordFeeRub, landlordBonusRub, tenantBonusRub, rates, breakdown, errors]
      properties:
        kind:
          type: string
          enum: [rental_deal]
        valid:
          type: boolean
        currency:
          type: string
          enum: [RUB]
        policyVersion:
          type: integer
        grossAmountRub:
          type: number
        landlordFeeRub:
          type: number
        landlordBonusRub:
          type: number
        tenantBonusRub:
          type: number
        rates:
          type: object
          required: [landlordFeeRate, landlordBonusRate, tenantBonusRate]
          properties:
            landlordFeeRate:
              type: number
            landlordBonusRate:
              type: number
            tenantBonusRate:
              type: number
        breakdown:
          type: object
          required: [grossRub, landlordFeeRub, landlordBonusRub, tenantBonusRub]
          properties:
            grossRub:
              type: number
            landlordFeeRub:
              type: number
            landlordBonusRub:
              type: number
            tenantBonusRub:
              type: number
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string

    FinancialDeal:
      type: object
      required: [id, kind, status, userId, policyVersion, idempotencyKey, currency, grossAmountRub, bonusRedeemedRub, netAmountRub, feeAmountRub, landlordBonusRub, tenantBonusRub, createdAt, settledAt, paymentProvider, paymentMethod, providerPaymentId, providerPaymentStatus, providerCheckoutUrl, providerRefundId, providerRefundStatus, paymentFailureReason, paymentUpdatedAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [partner_purchase, rental_deal]
        status:
          type: string
          enum: [pending, payment_failed, cancelled, settled, refunded]
        userId:
          type: integer
        partnerId:
          type: ["integer", "null"]
        leaseId:
          type: ["integer", "null"]
        policyVersion:
          type: integer
        externalReference:
          type: ["string", "null"]
        idempotencyKey:
          type: string
        currency:
          type: string
          enum: [RUB]
        grossAmountRub:
          type: number
        bonusRedeemedRub:
          type: number
        netAmountRub:
          type: number
        feeAmountRub:
          type: number
        landlordBonusRub:
          type: number
        tenantBonusRub:
          type: number
        paymentProvider:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [sbp, mir_pay]
        providerPaymentId:
          type: ["string", "null"]
        providerPaymentStatus:
          type: ["string", "null"]
        providerCheckoutUrl:
          type: ["string", "null"]
        providerRefundId:
          type: ["string", "null"]
        providerRefundStatus:
          type: ["string", "null"]
        paymentFailureReason:
          type: ["string", "null"]
        paymentUpdatedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        settledAt:
          type: ["string", "null"]
        refundedAt:
          type: ["string", "null"]

    SettlementResponse:
      type: object
      required: [deal, quote, idempotent]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        quote:
          oneOf:
            - $ref: "#/components/schemas/PurchaseQuote"
            - $ref: "#/components/schemas/RentalQuote"
        idempotent:
          type: boolean

    PurchaseCheckoutResponse:
      type: object
      required: [deal, quote, checkoutUrl, paymentStatus]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        quote:
          $ref: "#/components/schemas/PurchaseQuote"
        checkoutUrl:
          type: ["string", "null"]
        paymentStatus:
          type: string
          enum: [pending, waiting_for_capture, succeeded, canceled, failed]

    RentalCheckoutResponse:
      type: object
      required: [deal, quote, checkoutUrl, paymentStatus]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        quote:
          $ref: "#/components/schemas/RentalQuote"
        checkoutUrl:
          type: ["string", "null"]
        paymentStatus:
          type: string
          enum: [pending, waiting_for_capture, succeeded, canceled, failed]

    PurchasePaymentStatusResponse:
      type: object
      required: [deal, paymentStatus]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        paymentStatus:
          type: string
          enum: [pending, waiting_for_capture, succeeded, canceled, failed]
        providerPaymentId:
          type: ["string", "null"]
        message:
          type: ["string", "null"]

    RentalPaymentStatusResponse:
      type: object
      required: [deal, paymentStatus]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        paymentStatus:
          type: string
          enum: [pending, waiting_for_capture, succeeded, canceled, failed]
        providerPaymentId:
          type: ["string", "null"]
        message:
          type: ["string", "null"]

    WebhookResponse:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    RefundInput:
      type: object
      properties:
        idempotencyKey:
          type: string
          minLength: 1

    RefundResponse:
      type: object
      required: [deal, idempotent]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        idempotent:
          type: boolean

    FinancialLedgerEntry:
      type: object
      required: [id, dealId, transactionId, entryType, source, reference, amountRub, amountRubSigned, dealType, category, transactionType, partnerId, partnerName, settlementStatus, dealGrossAmountRub, dealNetAmountRub, dealFeeAmountRub, dealBonusRedeemedRub, dealLandlordBonusRub, dealTenantBonusRub, createdAt]
      properties:
        id:
          type: integer
        dealId:
          type: integer
        transactionId:
          type: ["integer", "null"]
        userId:
          type: ["integer", "null"]
        entryType:
          type: string
          enum: [debit, credit]
        source:
          type: string
        reference:
          type: string
        amountRub:
          type: number
        amountRubSigned:
          type: number
        dealType:
          type: ["string", "null"]
          enum: [partner_purchase, rental_deal, null]
        category:
          type: ["string", "null"]
        transactionType:
          type: ["string", "null"]
        partnerId:
          type: ["integer", "null"]
        partnerName:
          type: ["string", "null"]
        settlementStatus:
          type: ["string", "null"]
          enum: [pending, payment_failed, cancelled, settled, refunded, null]
        paymentProvider:
          type: ["string", "null"]
        providerPaymentId:
          type: ["string", "null"]
        providerPaymentStatus:
          type: ["string", "null"]
        providerRefundId:
          type: ["string", "null"]
        providerRefundStatus:
          type: ["string", "null"]
        dealIdempotencyKey:
          type: ["string", "null"]
        dealGrossAmountRub:
          type: ["number", "null"]
        dealNetAmountRub:
          type: ["number", "null"]
        dealFeeAmountRub:
          type: ["number", "null"]
        dealBonusRedeemedRub:
          type: ["number", "null"]
        dealLandlordBonusRub:
          type: ["number", "null"]
        dealTenantBonusRub:
          type: ["number", "null"]
        balanceAfterRub:
          type: ["number", "null"]
        reversalOfId:
          type: ["integer", "null"]
        createdAt:
          type: string

    PaymentReconciliationItem:
      type: object
      required: [id, kind, status, userId, userName, userPhone, partnerId, partnerName, policyVersion, idempotencyKey, grossAmountRub, bonusRedeemedRub, netAmountRub, feeAmountRub, landlordBonusRub, tenantBonusRub, currency, paymentProvider, paymentMethod, providerPaymentId, providerPaymentStatus, providerRefundStatus, paymentFailureReason, createdAt, paymentUpdatedAt, needsReview, reviewReason]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [partner_purchase, rental_deal]
        status:
          type: string
          enum: [pending, payment_failed, cancelled]
        userId:
          type: integer
        userName:
          type: string
        userPhone:
          type: string
        partnerId:
          type: ["integer", "null"]
        partnerName:
          type: ["string", "null"]
        policyVersion:
          type: integer
        idempotencyKey:
          type: string
        grossAmountRub:
          type: number
        bonusRedeemedRub:
          type: number
        netAmountRub:
          type: number
        feeAmountRub:
          type: number
        landlordBonusRub:
          type: number
        tenantBonusRub:
          type: number
        currency:
          type: string
          enum: [RUB]
        paymentProvider:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [sbp, mir_pay]
        providerPaymentId:
          type: ["string", "null"]
        providerPaymentStatus:
          type: ["string", "null"]
        providerRefundStatus:
          type: ["string", "null"]
        paymentFailureReason:
          type: ["string", "null"]
        createdAt:
          type: string
        paymentUpdatedAt:
          type: ["string", "null"]
        needsReview:
          type: boolean
        reviewReason:
          type: string

    PaymentReconciliationResolutionResponse:
      type: object
      required: [deal, paymentStatus, providerPaymentId, idempotent]
      properties:
        deal:
          $ref: "#/components/schemas/FinancialDeal"
        paymentStatus:
          type: string
          enum: [pending, waiting_for_capture, succeeded, canceled, failed]
        providerPaymentId:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        idempotent:
          type: boolean

    PaymentReconciliationSummary:
      type: object
      required: [total, pending, paymentFailed, cancelled, requiresReview, confirmedAwaitingReconciliation, confirmedAwaitingReconciliationLastUpdatedAt]
      properties:
        total:
          type: integer
        pending:
          type: integer
        paymentFailed:
          type: integer
        cancelled:
          type: integer
        requiresReview:
          type: integer
        confirmedAwaitingReconciliation:
          type: integer
          description: Provider-confirmed payments whose bonus debit is deferred until an administrator reconciles the balance.
        confirmedAwaitingReconciliationLastUpdatedAt:
          type: ["string", "null"]
          format: date-time
          description: Most recent provider or reconciliation update for a confirmed payment awaiting reconciliation.

    PaymentReconciliationReport:
      type: object
      required: [items, summary, status, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentReconciliationItem"
        summary:
          $ref: "#/components/schemas/PaymentReconciliationSummary"
        status:
          type: string
          enum: [all, pending, payment_failed, cancelled]
        limit:
          type: integer
        offset:
          type: integer

    BalanceReconciliation:
      type: object
      required: [userId, phone, name, pointsBalance, bonusBalanceRub, expectedBalanceRub, differenceRub, differenceCents, legacyEquivalentPoints, status, canCorrect]
      properties:
        userId:
          type: integer
        phone:
          type: string
        name:
          type: string
        pointsBalance:
          type: integer
        bonusBalanceRub:
          type: ["number", "null"]
        expectedBalanceRub:
          type: number
          description: Monetary value represented by the legacy point balance at 0.80 RUB per point.
        differenceRub:
          type: ["number", "null"]
        differenceCents:
          type: ["integer", "null"]
        legacyEquivalentPoints:
          type: ["integer", "null"]
        status:
          type: string
          enum: [consistent, rounding_difference, mismatch, unmigrated]
        canCorrect:
          type: boolean

    BalanceReconciliationSummary:
      type: object
      required: [totalUsers, consistent, roundingDifference, mismatch, unmigrated, returned]
      properties:
        totalUsers:
          type: integer
        consistent:
          type: integer
        roundingDifference:
          type: integer
        mismatch:
          type: integer
        unmigrated:
          type: integer
        returned:
          type: integer

    BalanceReconciliationReport:
      type: object
      required: [items, summary, status, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BalanceReconciliation"
        summary:
          $ref: "#/components/schemas/BalanceReconciliationSummary"
        status:
          type: string
          enum: [all, consistent, rounding_difference, mismatch, unmigrated]
        limit:
          type: integer
        offset:
