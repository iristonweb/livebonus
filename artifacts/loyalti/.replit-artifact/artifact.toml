kind = "web"
previewPath = "/"
title = "ЛоялТи — Платформа лояльности"
version = "1.0.0"
id = "artifacts/loyalti"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23657

[services.development]
run = "pnpm --filter @workspace/loyalti run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loyalti", "run", "build" ]
publicDir = "artifacts/loyalti/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23657"
BASE_PATH = "/"
